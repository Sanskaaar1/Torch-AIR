name: Claude PR Assistant

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

jobs:
  claude:
    # issue_comment also fires for issues. Limit this workflow to PR
    # conversation comments; Claude Code enforces that the invoking user has
    # repository write permission.
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      # Do not check out the PR head: its files are untrusted. The Claude
      # action receives the PR and comment context from GitHub directly.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Respond to maintainer prompt
        uses: anthropics/claude-code-action@v1
        with:
          use_vertex: 'true'
          trigger_phrase: '@claude'
          claude_args: >-
            --max-turns 12
            --model claude-4-0-sonnet@20250805
            --allowedTools "Read,Glob,Grep,Skill"
        env:
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          CLOUD_ML_REGION: ${{ vars.GCP_REGION }}
