name: GPT PR assistant

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    # A workflow run can be created for any issue comment, but only a trusted
    # PR commenter can enter the job. Command recognition is done by the
    # script, because GitHub expressions cannot safely express line anchors.
    if: >-
      github.event.issue.pull_request &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-base
          persist-credentials: false

      - name: Validate review-agent command
        id: command
        working-directory: trusted-base
        run: node .github/scripts/gpt-pr-assistant.mjs --validate

      - name: Check out PR head without executing it
        if: steps.command.outputs.accepted == 'true'
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          path: pr-head
          persist-credentials: false

      - name: Run read-only PR review
        if: steps.command.outputs.accepted == 'true'
        working-directory: trusted-base
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_CHECKOUT_PATH: ${{ github.workspace }}/pr-head
        run: node .github/scripts/gpt-pr-assistant.mjs
